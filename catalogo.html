document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

o;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #f2683c;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer;margin-top:1px;}\n  .grange::-moz-range-track{background:transparent;height:20px;}\n  .grange::-moz-range-thumb{pointer-events:auto;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #f2683c;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column;\">\n  <!-- ===== HEADER ===== -->\n  <header style=\"position:sticky;top:0;z-index:30;background:#15283a;color:#fff;\">\n    <div class=\"gheaderwrap\" style=\"max-width:1280px;margin:0 auto;padding:14px 24px;display:flex;flex-direction:column;gap:10px;\">\n      <div style=\"display:flex;align-items:center;gap:24px;\">\n        <span sc-camel-on-click=\"{{ irAInicio }}\" style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;letter-spacing:-.02em;flex-shrink:0;cursor:pointer;\">¡güao!<\u002Fspan>\n        <nav class=\"gheadernav\" style=\"display:flex;gap:4px;flex:1;overflow-x:auto;\">\n          <sc-for list=\"{{ generoTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div class=\"gtab\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fnav>\n        <div sc-camel-on-click=\"{{ openMisPedidos }}\" style=\"cursor:pointer;font-size:13px;color:#c4cdd6;white-space:nowrap;\">Mis pedidos<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ toggleCart }}\" style=\"cursor:pointer;position:relative;padding:6px;flex-shrink:0;\">\n          <span style=\"font-size:22px;\">🛍<\u002Fspan>\n          <sc-if value=\"{{ cartCount }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"position:absolute;top:-2px;right:-2px;background:#f2683c;color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 6px;\">{{ cartCount }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <nav class=\"gheadernav-mobile\" style=\"display:none;gap:4px;overflow-x:auto;\">\n        <sc-for list=\"{{ generoTabs }}\" as=\"t2\" hint-placeholder-count=\"4\">\n          <div class=\"gtab\" sc-camel-on-click=\"{{ t2.onClick }}\" style=\"{{ t2.style }}\">{{ t2.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ loadError }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:#fdeee6;color:#c2410c;padding:12px 24px;font-size:13.5px;text-align:center;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;\">\n    <span>No se pudo cargar el catálogo (revisa tu conexión o bloqueador de anuncios/rastreo, ej. Brave Shields).<\u002Fspan>\n    <span sc-camel-on-click=\"{{ retryLoad }}\" style=\"cursor:pointer;font-weight:700;text-decoration:underline;\">Reintentar<\u002Fspan>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===== INICIO (temporada) ===== -->\n  <sc-if value=\"{{ isInicio }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"background:{{ temporadaBg }};color:{{ temporadaFg }};\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:56px 24px 64px;\">\n      <div style=\"display:inline-block;background:{{ temporadaBadgeBg }};color:{{ temporadaBadgeFg }};font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:20px;margin-bottom:18px;\">{{ temporadaKicker }}<\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(32px,5vw,56px);line-height:1.05;max-width:780px;margin-bottom:14px;\">{{ temporadaTitulo }}<\u002Fdiv>\n      <div style=\"font-size:16px;line-height:1.5;max-width:520px;opacity:.9;margin-bottom:28px;\">{{ temporadaSub }}<\u002Fdiv>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n        <div sc-camel-on-click=\"{{ irAColeccion }}\" class=\"gbtn\" style=\"cursor:pointer;backgroun t',month:'short',year:'numeric'}); };\nconst rowToTp=(r)=>({id:r.id,nombre:r.nombre,marca:r.marca,genero:r.genero,tipoProducto:r.tipo_producto,tallas:r.tallas||'',sistemaTallas:r.sistema_tallas||'CO',colores:r.colores||'',\n  precioBase:r.precio_base,descuentoPct:r.descuento_pct,precioPublico:r.precio_publico,entregaInmediataManual:!!r.entrega_inmediata_manual,\n  invItemId:r.inv_item_id||'',activo:r.activo!==false,fotos:(r.fotos&&r.fotos.length===4)?r.fotos:['','','',''],creadoAt:r.creado_at,vendidos:r.vendidos||0,\n  stockGeneral:r.stock==null?null:r.stock,stockPorTalla:r.stock_por_talla||null});\n// ---- temporadas / campañas de la marca (según el mes) ----\nconst TEMPORADAS=[\n  {meses:[0],kicker:'Año nuevo, closet nuevo',titulo:'Empieza el año con paso firme.',sub:'Renueva tu colección con los lanzamientos que abren el año.',bg:'#15283a',fg:'#fff',badgeBg:'rgba(255,255,255,.12)',badgeFg:'#fff',ctaBg:'#f2683c',ctaFg:'#fff',cta:'Ver lanzamientos'},\n  {meses:[1],kicker:'San Valentín',titulo:'Para regalar o para regalarte.',sub:'Pares para dos — encuentra el detalle perfecto de Amor y Amistad adelantado.',bg:'#5c1a2e',fg:'#fff',badgeBg:'rgba(255,255,255,.14)',badgeFg:'#fff',ctaBg:'#f2683c',ctaFg:'#fff',cta:'Ver colección'},\n  {meses:[2,3],kicker:'Semana Santa',titulo:'Plan de vacaciones, tenis listos.',sub:'Cómodos para viajar, fuertes para el resto del año.',bg:'#1c9e6a',fg:'#fff',badgeBg:'rgba(255,255,255,.14)',badgeFg:'#fff',ctaBg:'#15283a',ctaFg:'#fff',cta:'Ver colección'},\n  {meses:[4],kicker:'Día de las Madres',titulo:'Ella también se merece un par nuevo.',sub:'Regalos con estilo para mamá — entrega inmediata disponible.',bg:'#7a3b57',fg:'#fff',badgeBg:'rgba(255,255,255,.14)',badgeFg:'#fff',ctaBg:'#f2683c',ctaFg:'#fff',cta:'Ver regalos'},\n  {meses:[5],kicker:'Día del Padre',titulo:'Lo clásico nunca pasa de moda.',sub:'Los modelos favoritos de papá, a un clic de distancia.',bg:'#233a52',fg:'#fff',badgeBg:'rgba(255,255,255,.14)',badgeFg:'#fff',ctaBg:'#f2683c',ctaFg:'#fff',cta:'Ver colección'},\n  {meses:[6,7],kicker:'Mitad de año',titulo:'Vacaciones sin frenar el paso.',sub:'Los pares que necesitas para viajes, playa y todo lo que viene.',bg:'#e0b400',fg:'#15283a',badgeBg:'rgba(21,40,58,.1)',badgeFg:'#15283a',ctaBg:'#15283a',ctaFg:'#fff',cta:'Ver vacaciones'},\n  {meses:[8],kicker:'Amor y Amistad',titulo:'El regalo que sí se usa.',sub:'Sorprende a tu combo con un par que no falla.',bg:'#c2410c',fg:'#fff',badgeBg:'rgba(255,255,255,.16)',badgeFg:'#fff',ctaBg:'#15283a',ctaFg:'#fff',cta:'Ver regalos'},\n  {meses:[9],kicker:'Temporada de estrenos',titulo:'Nueva racha, nuevo par.',sub:'Los lanzamientos de la temporada ya están en el catálogo.',bg:'#3a2e5c',fg:'#fff',badgeBg:'rgba(255,255,255,.14)',badgeFg:'#fff',ctaBg:'#f2683c',ctaFg:'#fff',cta:'Ver novedades'},\n  {meses:[10],kicker:'Black Friday',titulo:'Los descuentos más fuertes del año.',sub:'Aprovecha antes de que se agoten las tallas.',bg:'#000',fg:'#fff',badgeBg:'#f2683c',badgeFg:'#fff',ctaBg:'#f2683c',ctaFg:'#fff',cta:'Ver ofertas'},\n  {meses:[11],kicker:'Navidad',titulo:'El regalo bajo el árbol este año.',sub:'Entrega inmediata para que llegue a tiempo esta Navidad.',bg:'#7a1f2b',fg:'#fff',badgeBg:'rgba(255,255,255,.16)',badgeFg:'#fff',ctaBg:'#1c9e6a',ctaFg:'#fff',cta:'Ver regalos'}\n];\nconst getTemporada=()=>{\n  const mes=new Date().getMonth();\n  return TEMPORADAS.find(t=>t.meses.includes(mes))||TEMPORADAS[0];\n};\nconst CART_KEY='guao_tienda_cart';\nconst loadCart=()=>{ try{return JSON.parse(localStorage.getItem(CART_KEY))||[];}catch(e){return [];} };\nconst saveCart=(c)=>{ try{localStorage.setItem(CART_KEY,JSON.stringify(c));}catch(e){} };\n\nclass Component extends DCLogic {\n  state={\n    productos:[], loaded:false,\n    generoActivo:'INICIO', marcaFiltro:[], tallaFiltro:[], colorFiltro:[], tipoFiltro:[], categoriaFiltro:[], entregaTipoFiltro:[], precioMax:null, precioMin:null,\n    orden:'novedades', showFiltersMobile:false, busqueda:'',\n    cart:loadCart(), showCart:false,\n    showDetail:false, detailId:null, detailTalla:'', detailColor:'', detailAngulo:0,\n    showCheckout:false, orderConfirmed:false, confirmedTelefono:'',\n    checkoutForm:{nombre:'',telefono:'',correo:'',direccion:''},\n    showMisPedidos:false, mpCorreo:'', mpPedidos:[], mpSearched:false,\n    loadError:false\n  };\n  componentDidMount(){\n    this.loadProductos(0);\n  }\n  loadProductos(attempt){\n    const sb=getSB();\n    if(!sb){\n      // supabase-js (CDN) no cargó aún, o un bloqueador de contenido lo detuvo — reintenta un par de veces antes de avisar.\n      if(attempt<4){ setTimeout(()=>this.loadProductos(attempt+1),500); return; }\n      this.setState({loaded:true,loadError:true}); return;\n    }\n    sb.from('tienda_productos').select('*').then(({data,error})=>{\n      if(error){ this.setState({loaded:true,loadError:true}); return; }\n      const productos=(data||[]).map(rowToTp).filter(p=>p.activo!==false);\n      this.setState({productos,loaded:true,loadError:false});\n    }).catch(()=>{ this.setState({loaded:true,loadError:true}); });\n  }\n  stop=(e)=>e.stopPropagation();\n  setGenero=(g)=>this.setState({generoActivo:g,showFiltersMobile:false});\n  toggleMarca=(m)=>this.setState(s=>({marcaFiltro:s.marcaFiltro.includes(m)?s.marcaFiltro.filter(x=>x!==m):[...s.marcaFiltro,m]}));\n  toggleTalla=(t)=>this.setState(s=>({tallaFiltro:s.tallaFiltro.includes(t)?s.tallaFiltro.filter(x=>x!==t):[...s.tallaFiltro,t]}));\n  toggleColor=(c)=>this.setState(s=>({colorFiltro:s.colorFiltro.includes(c)?s.colorFiltro.filter(x=>x!==c):[...s.colorFiltro,c]}));\n  toggleTipo=(t)=>this.setState(s=>({tipoFiltro:s.tipoFiltro.includes(t)?s.tipoFiltro.filter(x=>x!==t):[...s.tipoFiltro,t]}));\n  toggleCategoria=(g)=>this.setState(s=>({categoriaFiltro:s.categoriaFiltro.includes(g)?s.categoriaFiltro.filter(x=>x!==g):[...s.categoriaFiltro,g]}));\n  toggleEntregaTipo=(t)=>this.setState(s=>({entregaTipoFiltro:s.entregaTipoFiltro.includes(t)?s.entregaTipoFiltro.filter(x=>x!==t):[...s.entregaTipoFiltro,t]}));\n  onPrecioMin=(e)=>this.setState({precioMin:e.target.value===''?null:parseFloat(e.target.value)});\n  onPrecioMax=(e)=>this.setState({precioMax:parseFloat(e.target.value)});\n  // slider de rango de precio: dos \"thumbs\" (divs) arrastrables a mano en vez de 2 <input range> superpuestos,\n  // que en varios navegadores se disparaban entre sí al hacer click (\"se volvía loca la barra\").\n  _dragPrecio=(key)=>(e)=>{\n    e.preventDefault();\n    const track=e.currentTarget.parentElement;\n    const tope=this._priceTope||300000;\n    const move=(ev)=>{\n      const pt=ev.touches?ev.touches[0]:ev;\n      const rect=track.getBoundingClientRect();\n      let pct=(pt.clientX-rect.left)/rect.width; pct=Math.max(0,Math.min(1,pct));\n      let val=Math.round((pct*tope)/10000)*10000;\n      if(key==='min'){ const curMax=this.state.precioMax==null?tope:this.state.precioMax; this.setState({precioMin:Math.min(val,curMax)}); }\n      else { const curMin=this.state.precioMin==null?0:this.state.precioMin; this.setState({precioMax:Math.max(val,curMin)}); }\n    };\n    const up=()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); document.removeEventListener('touchmove',move); document.removeEventListener('touchend',up); };\n    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);\n    document.addEventListener('touchmove',move,{passive:false}); document.addEventListener('touchend',up);\n    move(e);\n  };\n  limpiarFiltros=()=>this.setState({marcaFiltro:[],tallaFiltro:[],colorFiltro:[],tipoFiltro:[],categoriaFiltro:[],entregaTipoFiltro:[],precioMax:null,precioMin:null});\n  onOrden=(e)=>this.setState({orden:e.target.value});\n  onBusqueda=(e)=>this.setState(s=>({busqueda:e.target.value,generoActivo:e.target.value.trim()?'INICIO':s.generoActivo}));\n  toggleFiltersMobile=()=>this.setState(s=>({showFiltersMobile:!s.showFiltersMobile}));\n  toggleCart=()=>this.setState(s=>({showCart:!s.showCart}));\n  openDetail=(id)=>this.setState({showDetail:true,detailId:id,detailTalla:'',detailColor:'',detailAngulo:0});\n  selectAngulo=(i)=>this.setState({detailAngulo:i});\n  closeDetail=()=>this.setState({showDetail:false});\n  selectTalla=(t)=>this.setState({detailTalla:t});\n  selectColor=(c)=>this.setState({detailColor:c});\n  addToCart=()=>{\n    const p=this.state.productos.find(x=>x.id===this.state.detailId); if(!p)return;\n    const tallas=(p.tallas||'').split(',').map(x=>x.trim()).filter(Boolean);\n    if(tallas.length && !this.state.detailTalla){ alert('Selecciona una talla.'); return; }\n    const cart=[...this.state.cart];\n    if(p.entregaInmediataManual){\n      const disp=stockDe(p,this.state.detailTalla);\n      const yaEnCarrito=cart.filter(it=>it.productId===p.id&&it.talla===this.state.detailTalla).reduce((a,it)=>a+it.cantidad,0);\n      if(yaEnCarrito+1>disp){ alert('Solo quedan '+disp+' unidad(es) disponible(s) de esta talla.'); return; }\n    }\n    const idx=cart.findIndex(it=>it.productId===p.id&&it.talla===this.state.detailTalla&&it.color===this.state.detailColor);\n    if(idx>-1) cart[idx]={...cart[idx],cantidad:cart[idx].cantidad+1};\n    else cart.push({productId:p.id,nombre:p.nombre,marca:p.marca,precio:p.precioPublico,talla:this.state.detailTalla,color:this.state.detailColor,cantidad:1,imagenSrc:(p.fotos&&p.fotos[0])||''});\n    // (imagenBgImg se calcula al render desde imagenSrc, ver cartItems)\n    saveCart(cart);\n    this.setState({cart,showDetail:false,showCart:true});\n  };\n  changeQty=(idx,delta)=>{\n    const cart=this.state.cart.map((it,i)=>i===idx?{...it,cantidad:Math.max(1,it.cantidad+delta)}:it);\n    saveCart(cart); this.setState({cart});\n  };\n  removeItem=(idx)=>{ const cart=this.state.cart.filter((_,i)=>i!==idx); saveCart(cart); this.setState({cart}); };\n  goCheckout=()=>this.setState({showCart:false,showCheckout:true,orderConfirmed:false});\n  closeCheckout=()=>this.setState({showCheckout:false});\n  onCheckout=(e)=>{const f=e.target.dataset.field,v=e.target.value;this.setState(s=>({checkoutForm:{...s.checkoutForm,[f]:v}}));};\n  submitOrder=()=>{\n    const f=this.state.checkoutForm;\n    if(!f.nombre||!f.nombre.trim()){alert('Ingresa tu nombre.');return;}\n    if(!f.telefono||!f.telefono.trim()){alert('Ingresa tu WhatsApp o teléfono.');return;}\n    if(!f.correo||!f.correo.trim()||!f.correo.includes('@')){alert('Ingresa un correo electrónico válido — lo usarás para hacer seguimiento a tu pedido.');return;}\n    if(!f.direccion||!f.direccion.trim()){alert('Ingresa la dirección de entrega.');return;}\n    if(!this.state.cart.length){alert('Tu carrito está vacío.');return;}\n    const total=this.state.cart.reduce((a,it)=>a+it.precio*it.cantidad,0);\n    const order={id:'ped'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),\n      fecha:new Date().toISOString(),cliente_nombre:f.nombre.trim(),cliente_telefono:f.telefono.trim(),cliente_correo:f.correo.trim().toLowerCase(),cliente_direccion:f.direccion.trim(),\n      items:this.state.cart.map(it=>({productoId:it.productId,nombre:it.nombre,talla:it.talla,color:it.color,cantidad:it.cantidad,precioUnit:it.precio})),\n      total,metodo_pago:'CONTRA_ENTREGA',estado:'NUEVO',notas:''};\n    const sb=getSB();\n    if(sb) sb.from('pedidos_web').insert(order).then(()=>{});\n    saveCart([]);\n    this.setState({cart:[],orderConfirmed:true,confirmedCorreo:f.correo.trim()});\n  };\n  openMisPedidos=()=>this.setState({showMisPedidos:true,mpSearched:false,mpPedidos:[]});\n  closeMisPedidos=()=>this.setState({showMisPedidos:false});\n  onMpCorreo=(e)=>this.setState({mpCorreo:e.target.value});\n  buscarMisPedidos=()=>{\n    const correo=(this.state.mpCorreo||'').trim().toLowerCase(); if(!correo)return;\n    const sb=getSB(); if(!sb){this.setState({mpSearched:true,mpPedidos:[]});return;}\n    sb.from('pedidos_web').select('*').eq('cliente_correo',correo).then(({data,error})=>{\n      this.setState({mpSea
